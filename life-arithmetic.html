<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>人生算術題</title><style>*{box-sizing:border-box}body{margin:0;background:#fffaf4;color:#293142;font-family:Arial,'Noto Sans TC',sans-serif}.page{width:min(1180px,calc(100% - 26px));margin:auto;padding:35px 0 70px}header{display:flex;align-items:end;gap:18px;flex-wrap:wrap;border-bottom:2px solid #e3d6c8;padding-bottom:18px}.eyebrow{color:#b35b47;letter-spacing:.12em;font-size:.8rem;font-weight:bold;margin:0 0 8px}h1{font:clamp(2rem,5vw,3.4rem) Georgia,'Noto Serif TC',serif;margin:0;flex:1}.name{color:#5d6470}.name input{width:140px;border:0;border-bottom:1px solid #718094;background:transparent;padding:5px}.card{margin:24px 0 12px;padding:20px 24px;background:#fff;border-radius:16px;box-shadow:0 5px 20px #503e2a10;line-height:1.8}.card input{margin-left:8px;width:130px;padding:5px;border:1px solid #d7d0c8;border-radius:7px}.note{font-size:.9rem;color:#6c6b6b}.tip{color:#5d6470;font-size:.92rem}.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 0;font-size:.88rem}.color{width:26px;height:26px;border-radius:50%;border:3px solid transparent}.color.on{outline:2px solid #26354e;border-color:#fff}.clear{margin-left:auto;padding:6px 11px;background:#fff;border:1px solid #d6cac0;border-radius:8px}.board{position:relative;aspect-ratio:20/24;background:white;border:1px solid #647184}.grid{height:100%;display:grid;grid-template-columns:repeat(20,1fr);grid-template-rows:repeat(48,1fr)}.grid span{display:grid;place-items:center;border-right:1px solid #b9c0c8;border-bottom:1px solid #b9c0c8;font-size:clamp(5px,1.4vw,14px);color:#515b69}canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}@media(max-width:600px){.page{width:calc(100% - 18px);padding-top:22px}.grid span{font-size:5px}.clear{margin-left:0}}@media print{.toolbar,.tip{display:none}.page{width:100%;padding:0}}</style><main class="page"><header><div><p class="eyebrow">作業一</p><h1>人生算術題</h1></div><label class="name">姓名 <input placeholder="請輸入姓名"></label></header><section class="card"><ol><li>你活了幾個月？<input placeholder="填入答案"></li><li>你最親近的長輩，離 80 歲還有幾年？<input placeholder="填入答案"></li><li>每年你能陪他／她幾天？<input placeholder="填入答案"></li></ol><p class="note">備註：表格數字以「月」為單位。115 年國人平均壽命約 81 歲。</p></section><p class="tip">選擇顏色後，直接在下方生命月份表上畫線或圈記。</p><div class="toolbar"><span>畫筆顏色</span><button class="color on" data-c="#e45858" style="background:#e45858"></button><button class="color" data-c="#e7a92f" style="background:#e7a92f"></button><button class="color" data-c="#4a9a63" style="background:#4a9a63"></button><button class="color" data-c="#2876b6" style="background:#2876b6"></button><button class="color" data-c="#855bb5" style="background:#855bb5"></button><label>粗細 <input id="size" type="range" min="2" max="10" value="4"></label><button class="clear">清除線條</button></div><div class="board"><div class="grid" id="grid"></div><canvas id="canvas"></canvas></div></main><script>const grid=document.querySelector('#grid');for(let i=1;i<=960;i++)grid.innerHTML+='<span>'+i+'</span>';const c=document.querySelector('#canvas'),x=c.getContext('2d'),size=document.querySelector('#size');let color='#e45858',on=false,last;function resize(){let r=c.getBoundingClientRect(),old=c.toDataURL();c.width=r.width*devicePixelRatio;c.height=r.height*devicePixelRatio;x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);let im=new Image;im.onload=()=>x.drawImage(im,0,0,r.width,r.height);im.src=old}resize();addEventListener('resize',resize);document.querySelectorAll('.color').forEach(b=>b.onclick=()=>{color=b.dataset.c;document.querySelectorAll('.color').forEach(q=>q.classList.remove('on'));b.classList.add('on')});c.onpointerdown=e=>{on=true;last=pt(e);c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(!on)return;let p=pt(e);x.strokeStyle=color;x.lineWidth=size.value;x.lineCap='round';x.beginPath();x.moveTo(last.x,last.y);x.lineTo(p.x,p.y);x.stroke();last=p};c.onpointerup=c.onpointercancel=()=>on=false;function pt(e){let r=c.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}document.querySelector('.clear').onclick=()=>x.clearRect(0,0,c.width,c.height);</script>
