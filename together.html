dth,c.height);;document.querySelector("#save").onclick=async()=>{const name=document.querySelector("#studentName").value.trim(),status=document.querySelector("#status");if(!name){status.textContent="請先填寫姓名。";return}const b=document.querySelector("#save");b.disabled=true;status.textContent="送出中…";try{const r=await fetch("https://life-time-worksheets.hsiaomei.chatgpt.site/api/submissions",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({assignment:"together",studentName:name,answers:{reflection:document.querySelector(".reflection").value},imageDataUrl:c.toDataURL("image/png")})}),j=await r.json();if(!r.ok)throw Error(j.error);status.textContent="已送出，謝謝！"}catch(e){b.disabled=false;status.textContent=e.message||"送出失敗，請再試一次。"}};</script>
